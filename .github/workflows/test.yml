---
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '4.0' }
          - { ruby: '3.4' }
          - { ruby: '3.2', json: '2' }
          - { ruby: '3.2' }
          - { ruby: '2.7', json: '2' }
          - { ruby: 'ruby-head', allowed-failure: true }
          - { ruby: 'jruby-head', allowed-failure: true }
    name: test (Ruby ${{ matrix.entry.ruby }}, JSON ${{ matrix.entry.json || '3' }})
    env:
      JSON_VERSION: ${{ matrix.entry.json || '3' }}
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake test spinach
        continue-on-error: ${{ matrix.entry.allowed-failure || false }}
