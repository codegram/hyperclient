name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false
      dry-run:
        description: Check release prerequisites without releasing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.9.0
    with:
      ruby-version: '4.0'
      gemfile: gemfiles/release.gemfile
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
